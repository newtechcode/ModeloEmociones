<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Explorador de Emociones IA</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>🧠 Explorador de Modelos de IA</h1>
    <p>Interacción con tu modelo de Teachable Machine</p>
  </header>

  <main>
    <section class="camera-section">
      <video id="webcam" autoplay playsinline></video>
    </section>

    <section class="controls">
      <button onclick="init()">Iniciar Cámara</button>
    </section>

    <section id="label-container" class="results"></section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest"></script>
  <script src="script.js"></script>
</body>
</html>
